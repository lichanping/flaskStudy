<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老师登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="auth-shell">
    <section class="auth-left">
        <h1 class="auth-title">老师登录</h1>
        <p class="auth-subtitle">用于带学生完成学新流程、复核学习结果并生成抗遗忘复习任务。</p>
        <div class="auth-note">POC 默认老师账号: teacher / teacher123</div>
    </section>
    <section class="auth-right">
        {% if error_message %}
        <p class="error-message">{{ error_message }}</p>
        {% endif %}
        <form class="auth-form" action="/login/teacher" method="post">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" placeholder="输入老师账号" required>

            <label for="password">密码</label>
            <input id="password" name="password" type="password" placeholder="输入密码" required>

            <button class="btn-primary" type="submit">登录</button>
        </form>
        <a class="switch-link" href="/login/student">切换到学生登录</a>
    </section>
</div>
</body>
</html>
