<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学新完成</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/newflow.css') }}">
    <style>
        .result-card p {
            margin: 8px 0;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 12px;
                border-radius: 12px;
            }

            h1 {
                font-size: 28px;
                line-height: 1.3;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .actions .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card result-card">
        <h1>学新完成</h1>
        <p>学生：{{ result.student_name }}</p>
        <p>词库：{{ result.source_file.replace('.txt', '') }}</p>
        <p>本轮确认学会单词数：<strong>{{ result.known_count }}</strong></p>
        <p>本轮新增抗遗忘任务单词数：<strong>{{ result.newly_learned_count }}</strong></p>
        <div class="actions">
            <a class="btn btn-primary" href="{{ url_for('new_start') }}">继续下一轮学新</a>
            <a class="btn btn-secondary" href="{{ url_for('index', learning_mode='review') }}">查看抗遗忘复习页</a>
        </div>
    </div>
</div>
</body>
</html>
