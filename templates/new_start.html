<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学新 - 标记会/不会</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/newflow.css') }}">
    <style>
        .start-filters {
            display: flex;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 10px 12px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-item label {
            white-space: nowrap;
        }

        .filter-item select {
            min-width: 180px;
        }

        .decision-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .decision-option {
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 12px;
                border-radius: 12px;
            }

            h1 {
                font-size: 28px;
                line-height: 1.3;
            }

            .start-filters {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .filter-item {
                display: grid;
                grid-template-columns: 56px 1fr;
                gap: 8px;
                align-items: center;
            }

            .filter-item select {
                min-width: 0;
                width: 100%;
            }

            .refresh-btn {
                width: 100%;
            }

            .word-row {
                grid-template-columns: 28px 1fr;
                gap: 8px;
            }

            .decision-group {
                grid-column: 2;
                padding-top: 6px;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .actions .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>学新流程：步骤 1/3 - 标记会/不会</h1>
        <div class="meta">当前老师：{{ user.username }}。先标记本轮词汇，再进入每组 5 词训练。</div>
    </div>

    <form method="post" action="{{ url_for('new_start') }}">
        <div class="card">
            <div class="start-filters">
                <div class="filter-item">
                    <label for="student_name">学生：</label>
                    <select id="student_name" name="student_name">
                        {% for student in students %}
                        <option value="{{ student }}" {% if student == selected_student %}selected{% endif %}>{{ student }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-item">
                    <label for="file_name">词库：</label>
                    <select id="file_name" name="file_name">
                        {% for file in files %}
                        <option value="{{ file }}" {% if file == selected_file %}selected{% endif %}>{{ file.replace('.txt', '') }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="btn btn-secondary refresh-btn" type="submit" formaction="{{ url_for('new_start') }}" formmethod="get">刷新词库</button>
            </div>
        </div>

        <div class="card">
            <h3>本轮词汇（默认都标记为不会）</h3>
            {% for word in words %}
            <div class="word-row">
                <div class="index">{{ loop.index }}</div>
                <div>
                    <div class="term">{{ word.term }}</div>
                    <div class="meaning">{{ word.meaning }}</div>
                </div>
                <div class="decision-group">
                    <label class="decision-option">
                        <input type="radio" name="decision_{{ word.id }}" value="known"> 会
                    </label>
                    <label class="decision-option">
                        <input type="radio" name="decision_{{ word.id }}" value="unknown" checked> 不会
                    </label>
                </div>
            </div>
            {% endfor %}

            <div class="actions">
                <button type="submit" class="btn btn-primary">开始训练（每组 5 词）</button>
                <a class="btn btn-secondary" href="{{ url_for('index') }}">返回复习主页</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
